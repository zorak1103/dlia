# generated by go-github-pipelines v1.3.0

version: '3'

vars:
  MODULE: "github.com/zorak1103/dlia"
  BINARY: "dlia"
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  LDFLAGS: "-s -w -X github.com/zorak1103/dlia/internal/version.Version={{.VERSION}}"
  COVERAGE_THRESHOLD: "80"
  GOFLAGS: ""
  RACE: ""

tasks:
  # ============================================================================
  # DEVELOPMENT
  # ============================================================================
  default:
    desc: Build the project
    cmds:
      - task: build

  build:
    desc: Compile the binary
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY}}{{exeExt}} .

  run:
    desc: Run the application
    cmds:
      - go run . {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}{{exeExt}} coverage.out coverage-report.txt vulncheck_output.json

  # ============================================================================
  # TESTING
  # ============================================================================
  test:
    desc: Run tests (set RACE=-race for race detection)
    env:
      CGO_ENABLED: "{{if .RACE}}1{{else}}0{{end}}"
    cmds:
      - go test {{.RACE}} {{.GOFLAGS}} ./...

  test:coverage:
    desc: Run tests with per-file coverage enforcement (80% gate)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - ./scripts/check-coverage.sh coverage.out {{.COVERAGE_THRESHOLD}}

  test:watch:
    desc: Run tests in watch mode (requires gotestsum)
    env:
      CGO_ENABLED: "1"
    cmds:
      - gotestsum --watch ./...

  eval:
    desc: Run the LLM eval suite against a real model (needs DLIA_LLM_API_KEY + DLIA_LLM_MODEL; costs money, not in CI)
    cmds:
      - go test -tags eval -count=1 -v -timeout 30m ./internal/eval/

  # ============================================================================
  # CODE QUALITY
  # ============================================================================
  lint:
    desc: Run golangci-lint (CI installs it; locally run `task lint:install` first)
    cmds:
      - golangci-lint run --timeout=5m ./...

  lint:install:
    desc: Install golangci-lint locally (tracked by Renovate)
    cmds:
      # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Check Go formatting (non-destructive)
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"; echo "$unformatted"; exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  # ============================================================================
  # MUTATION TESTING
  # ============================================================================
  gremlins:
    desc: Run mutation testing with gremlins unleash (via Docker, persistent Go caches)
    cmds:
      - task: gremlins:cache:init
      # Persistent Go caches cut ~60-100s of toolchain download + cold compile
      # per run; the explicit timeout-coefficient keeps the derived per-mutant
      # timeout above real test time when the coverage phase itself is cached
      # (a fast coverage phase otherwise shrinks the ceiling and causes mass
      # false TIMED OUT results).
      - docker run --rm -v "{{.TASKFILE_DIR}}:/app" -v gremlins-gopkg:/go/pkg -v gremlins-gocache:/home/nonroot/.cache/go-build -w /app -e GOTOOLCHAIN=auto gogremlins/gremlins:0.6.0 gremlins unleash . --timeout-coefficient 60

  gremlins:cache:init:
    desc: One-time setup of the persistent Go caches for gremlins (idempotent)
    cmds:
      - docker volume create gremlins-gopkg
      - docker volume create gremlins-gocache
      # The image runs as uid 1000; named volumes mount root-owned, so grant
      # access once and leave a marker to keep repeat runs cheap.
      - docker run --rm -v gremlins-gopkg:/go/pkg -v gremlins-gocache:/home/nonroot/.cache/go-build --user root --entrypoint sh gogremlins/gremlins:0.6.0 -c "test -f /go/pkg/.dlia-cache-ready || (chown -R 1000:1000 /go/pkg /home/nonroot/.cache/go-build && touch /go/pkg/.dlia-cache-ready)"

  gremlins:pkg:
    desc: Mutation-test one package with the full suite per mutant (-i), e.g. `task gremlins:pkg -- ./internal/llm`
    cmds:
      - task: gremlins:cache:init
      # Non-integration gremlins can misreport kill status for a package's
      # mutants; -i runs the complete suite per mutant and is authoritative.
      - docker run --rm -v "{{.TASKFILE_DIR}}:/app" -v gremlins-gopkg:/go/pkg -v gremlins-gocache:/home/nonroot/.cache/go-build -w /app -e GOTOOLCHAIN=auto gogremlins/gremlins:0.6.0 gremlins unleash {{.CLI_ARGS}} -i --timeout-coefficient 60

  gremlins:install:
    desc: Install the gremlins binary locally for native use (tracked by Renovate)
    cmds:
      # renovate: datasource=go depName=github.com/go-gremlins/gremlins
      - go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

  # ============================================================================
  # SECURITY
  # ============================================================================
  vulncheck:
    desc: Run govulncheck (CI installs it; locally run `task vulncheck:install` first)
    cmds:
      - govulncheck ./...

  vulncheck:install:
    desc: Install govulncheck locally (tracked by Renovate)
    cmds:
      # renovate: datasource=go depName=golang.org/x/vuln
      - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

  # ============================================================================
  # DEPENDENCY MANAGEMENT
  # ============================================================================
  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  deps:download:
    desc: Download all dependencies
    cmds:
      - go mod download

  # ============================================================================
  # SETUP
  # ============================================================================
  install-hooks:
    desc: Install git hooks (run once after cloning)
    cmds:
      - git config core.hooksPath .githooks
      - chmod +x .githooks/pre-commit .githooks/pre-push || true
